# Soumet le sitemap à IndexNow après un déploiement GitHub Pages.
#
# « pages build and deployment » est un workflow géré par GitHub. Un
# workflow_run qui l'écoute ne part pas : la seule exécution historique
# (19 août 2026) était un workflow_dispatch, et les déploiements Pages
# suivants n'ont rien déclenché. On part donc sur le push vers main, puis
# on attend le déploiement github-pages de ce même commit.
name: IndexNow

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simuler sans appeler l'API IndexNow
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Attendre le déploiement GitHub Pages
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          for attempt in $(seq 1 40); do
            id="$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&sha=${sha}&per_page=10" --jq "[.[] | select(.sha==\"${sha}\")] | .[0].id // empty")"
            if [ -z "${id}" ]; then
              echo "Tentative ${attempt}/40 — pas encore de déploiement github-pages pour ${sha}"
              sleep 15
              continue
            fi
            states="$(gh api "repos/${{ github.repository }}/deployments/${id}/statuses" --jq '[.[].state] | join(",")')"
            latest="${states%%,*}"
            echo "Tentative ${attempt}/40 — déploiement ${id} : ${states:-pending}"
            case ",${states}," in
              *,success,*)
                echo "Déploiement GitHub Pages réussi pour ${sha}"
                exit 0
                ;;
            esac
            if [ "${latest}" = "failure" ] || [ "${latest}" = "error" ]; then
              echo "Le déploiement GitHub Pages a échoué"
              exit 1
            fi
            sleep 15
          done
          echo "Délai dépassé en attendant le déploiement github-pages de ${sha}"
          exit 1

      - name: Publier le sitemap vers IndexNow
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/indexnow.py --dry-run
          else
            python3 scripts/indexnow.py
          fi

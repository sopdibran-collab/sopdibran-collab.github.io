name: IndexNow

on:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect changed HTML pages
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Commit analysé : ${HEAD_SHA}"

          if git rev-parse --verify "${HEAD_SHA}^" >/dev/null 2>&1; then
            FILES="$(git diff --name-only "${HEAD_SHA}^" "${HEAD_SHA}" -- '*.html')"
          else
            FILES="$(git diff-tree --no-commit-id --name-only -r "${HEAD_SHA}" -- '*.html')"
          fi

          URLS=""

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" == "index.html" ]]; then
              url="https://sopjanitech.ch/"
            elif [[ "$file" == */index.html ]]; then
              directory="${file%/index.html}"
              url="https://sopjanitech.ch/${directory}/"
            else
              url="https://sopjanitech.ch/${file}"
            fi

            URLS="${URLS}${url}"$'\n'
          done <<< "$FILES"

          printf '%s' "$URLS" > changed_urls.txt

          if [[ -z "$URLS" ]]; then
            echo "has_urls=false" >> "$GITHUB_OUTPUT"
            echo "Aucun fichier HTML modifié. Pas de soumission IndexNow."
          else
            echo "has_urls=true" >> "$GITHUB_OUTPUT"
            echo "URLs détectées :"
            cat changed_urls.txt
          fi

      - name: Submit URLs to IndexNow
        if: steps.changed.outputs.has_urls == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r url; do
            [[ -z "$url" ]] && continue

            echo "Envoi IndexNow : $url"
            python3 scripts/indexnow.py "$url"
          done < changed_urls.txt